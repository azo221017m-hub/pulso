services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulso
      POSTGRES_PASSWORD: pulso
      POSTGRES_DB: pulso
    ports:
      - '5432:5432'
    volumes:
      - pulso_postgres_data:/var/lib/postgresql/data

volumes:
  pulso_postgres_data:
