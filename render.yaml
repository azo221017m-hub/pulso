services:
  - type: web
    name: pulso-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run deploy:build
    startCommand: npm run deploy:start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
